---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Include vars
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get bookorbit db container state
      community.docker.docker_container_info:
        name: "{{ bookorbit_db_container_name }}"
      register: result_db

    - name: Get bookorbit container state
      community.docker.docker_container_info:
        name: "{{ bookorbit_container_name }}"
      register: result

    - name: Get bookorbit metadata provider container states
      community.docker.docker_container_info:
        name: "{{ item.container_name }}"
      loop: "{{ bookorbit_metadata_providers }}"
      loop_control:
        label: "{{ item.key }}"
      register: result_providers

    - name: Check if bookorbit metadata provider containers are running
      ansible.builtin.assert:
        that:
          - item.container['State']['Status'] == "running"
          - item.container['State']['Restarting'] == false
      loop: "{{ result_providers.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Check if bookorbit containers are running
      ansible.builtin.assert:
        that:
          - result_db.container['State']['Status'] == "running"
          - result_db.container['State']['Restarting'] == false
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false

    - name: Check if the import directory is mounted read-only
      ansible.builtin.assert:
        that:
          - result.container['Mounts'] | selectattr('Destination', 'equalto', '/import') | list | length == 1
          - result.container['Mounts'] | selectattr('Destination', 'equalto', '/import') | map(attribute='RW') | first == false
