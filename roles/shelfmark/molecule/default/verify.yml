---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Include vars
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get shelfmark container state
      community.docker.docker_container_info:
        name: "{{ shelfmark_container_name }}"
      register: result

    - name: Check if shelfmark container is running
      ansible.builtin.assert:
        that:
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false
          - result.container['Config']['User'] == "1000:1000"

    - name: Check if shelfmark volumes are mounted
      ansible.builtin.assert:
        that:
          - result.container['Mounts'] | selectattr('Destination', 'equalto', item) | list | length == 1
      loop:
        - /config
        - /books
        - /downloads

    - name: Check if shelfmark scratch and log directories are tmpfs
      ansible.builtin.assert:
        that:
          - "'/tmp' in result.container['HostConfig']['Tmpfs']"
          - "'/var/log/shelfmark' in result.container['HostConfig']['Tmpfs']"

    - name: Check that only set environment variables are passed
      ansible.builtin.assert:
        that:
          - result.container['Config']['Env'] | select('match', 'EXT_BYPASSER_URL=http://flaresolverr:8191') | list | length == 1
          - result.container['Config']['Env'] | select('match', 'AUTH_METHOD=') | list | length == 0
          - result.container['Config']['Env'] | select('match', 'SHELFMARK_API_KEY=') | list | length == 0
          - result.container['Config']['Env'] | select('match', 'PUID=1000') | list | length == 1
