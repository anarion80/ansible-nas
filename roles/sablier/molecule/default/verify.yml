---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Include vars
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Sablier container state
      community.docker.docker_container_info:
        name: "{{ sablier_container_name }}"
      register: sablier_result

    - name: Check if Sablier container is running
      ansible.builtin.assert:
        that:
          - sablier_result.exists
          - sablier_result.container['State']['Status'] == "running"
          - sablier_result.container['State']['Restarting'] == false
