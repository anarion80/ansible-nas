---
# External Access
# Traefik will allow access to certain applications externally. To enable this you'll either; a domain name that points to your
# home static IP address, the cloudflare with the cloudflare_ddns dynamic DNS container enabled, or use a dynamic DNS provider like no-ip.
# You'll also need to map ports 80 and 443 from your router to your ansible-nas server, then enable the per-app "available_externally"
# settings.
traefik_enabled: false

# directories
traefik_data_directory: "{{ docker_home }}/traefik"
# File provider directory, mounted at /etc/traefik/dynamic
traefik_dynamic_config_directory: "{{ traefik_data_directory }}/dynamic"

# network
traefik_port_http: "80"
traefik_port_https: "443"
traefik_port_ui: "8083"

traefik_container_name: "traefik"
traefik_image_name: "traefik"
traefik_image_version: "latest"
traefik_log_level: "INFO"

# find the relevant name and environment variables for your DNS provider at https://go-acme.github.io/lego/dns/.
# More info at https://doc.traefik.io/traefik/https/acme/
traefik_dns_provider: cloudflare
traefik_environment_variables:
  CF_DNS_API_TOKEN: "abcdabcd123412341234"

# Ansible-NAS requests a wildcard certificate for your domain, so there should be no reason to have to use the staging
# letsencrypt acme server. If you do want to flip between staging/production, you might need to stop Traefik and clear
# the "{{ docker_home }}/traefik" after changing this setting.
# traefik_acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory" # staging
traefik_acme_server: "https://acme-v02.api.letsencrypt.org/directory" # production

# specs
traefik_memory: 1g

# Sablier plugin
# Registers https://github.com/sablierapp/sablier-traefik-plugin in the Traefik static configuration
# and adds a middleware definition to the file provider. The middleware is named after
# traefik_sablier_plugin_middleware_name and is referenced as "<name>@file" from a router.
traefik_sablier_plugin_enabled: false
traefik_sablier_plugin_version: "v1.4.0"
traefik_sablier_plugin_middleware_name: "sablier"
# Traefik runs with host networking, so the Sablier API is reachable on the loopback interface
traefik_sablier_plugin_url: "http://127.0.0.1:{{ sablier_port | default('10002', true) }}"
traefik_sablier_plugin_group: "default"
traefik_sablier_plugin_session_duration: "5m"
# Disabled when empty, must be shorter than traefik_sablier_plugin_session_duration
traefik_sablier_plugin_keep_alive_interval: ""
traefik_sablier_plugin_fail_open: false
# Give up connecting to Sablier after this time, disabled when empty
traefik_sablier_plugin_dial_timeout: "2s"
# Requests with a matching User-Agent are answered immediately without waking the containers
traefik_sablier_plugin_ignore_user_agent: []
# Only one strategy can be used: "dynamic" shows a waiting page, "blocking" waits for the containers
traefik_sablier_plugin_strategy: "dynamic"
traefik_sablier_plugin_dynamic_display_name: "Sablier"
traefik_sablier_plugin_dynamic_show_details: true
traefik_sablier_plugin_dynamic_theme: "hacker-terminal"
traefik_sablier_plugin_dynamic_refresh_frequency: "5s"
traefik_sablier_plugin_blocking_timeout: "1m"
