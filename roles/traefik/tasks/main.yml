---
- name: Start Traefik
  block:
    - name: Create Traefik Directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
      with_items:
        - '{{ traefik_data_directory }}'
        - '{{ traefik_data_directory }}/letsencrypt'
        - '{{ traefik_dynamic_config_directory }}'
    - name: Template Traefik config.toml
      ansible.builtin.template:
        src: traefik.toml
        dest: '{{ traefik_data_directory }}/traefik.toml'
      register: traefik_template_config
    - name: Template Traefik Sablier plugin middleware
      ansible.builtin.template:
        src: sablier.yml.j2
        dest: '{{ traefik_dynamic_config_directory }}/sablier.yml'
      when: traefik_sablier_plugin_enabled is true
    - name: Remove Traefik Sablier plugin middleware
      ansible.builtin.file:
        path: '{{ traefik_dynamic_config_directory }}/sablier.yml'
        state: absent
      when: traefik_sablier_plugin_enabled is false
    - name: Traefik Docker Container
      community.docker.docker_container:
        name: '{{ traefik_container_name }}'
        image: '{{ traefik_image_name }}:{{ traefik_image_version }}'
        pull: true
        network_mode: host
        volumes:
          - '{{ traefik_data_directory }}/traefik.toml:/etc/traefik/traefik.toml:ro'
          - '{{ traefik_dynamic_config_directory }}:/etc/traefik/dynamic:ro'
          - '{{ traefik_data_directory }}/letsencrypt:/letsencrypt:rw'
          - /var/run/docker.sock:/var/run/docker.sock:ro
        env: '{{ traefik_environment_variables }}'
        restart_policy: unless-stopped
        memory: '{{ traefik_memory }}'
        recreate: '{{ traefik_template_config is changed }}'
        labels:
          homepage.group: Networking
          homepage.name: Traefik
          homepage.icon: traefik
          homepage.href: http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{
            traefik_port_ui }}
          homepage.description: Reverse Proxy
          homepage.widget.type: traefik
          homepage.widget.url: http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{
            traefik_port_ui }}
  when: traefik_enabled is true
- name: Stop Traefik
  block:
    - name: Stop Traefik
      community.docker.docker_container:
        name: '{{ traefik_container_name }}'
        state: absent
  when: traefik_enabled is false
