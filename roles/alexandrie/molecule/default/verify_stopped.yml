---
- name: Verify Stopped
  hosts: all
  gather_facts: false
  tasks:
    - name: Include vars
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Alexandrie
      community.docker.docker_container:
        name: "{{ alexandrie_container_name }}"
        state: absent
      register: result

    - name: Try and stop and remove Alexandrie backend
      community.docker.docker_container:
        name: "{{ alexandrie_backend_container_name }}"
        state: absent
      register: result_backend

    - name: Try and stop and remove Alexandrie RustFS
      community.docker.docker_container:
        name: "{{ alexandrie_rustfs_container_name }}"
        state: absent
      register: result_rustfs

    - name: Try and stop and remove Alexandrie MySQL
      community.docker.docker_container:
        name: "{{ alexandrie_db_container_name }}"
        state: absent
      register: result_db

    - name: Try and remove Alexandrie network
      community.docker.docker_network:
        name: "{{ alexandrie_network_name }}"
        state: absent
      register: result_network

    - name: Check if Alexandrie is stopped
      ansible.builtin.assert:
        that:
          - not result.changed
          - not result_backend.changed
          - not result_rustfs.changed
          - not result_db.changed
          - not result_network.changed
