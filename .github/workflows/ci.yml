---
name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          # ansible-core 2.21 supports Python up to 3.14. "3.x" now resolves to
          # 3.15, where ansible-core/ansible-lint crash on the removed
          # dataclasses._is_type attribute, so pin to a supported release.
          python-version: "3.14"
      - name: Install test dependencies
        run: pip3 install ansible yamllint==1.37.1 ansible-lint==25.11.0
      - name: Ansible-lint
        run: ansible-lint nas.yml
      - name: Lint yaml files
        run: yamllint .
      - name: Lint docs
        uses: articulate/actions-markdownlint@main
        with:
          version: 0.32.2
